# Пример конфигурации debate. Конфиги накладываются слоями (каждый следующий перекрывает предыдущий):
#   встроенные значения → ~/.config/debate/config.toml → <репо>/.debate/config.toml → флаги запуска
# Скопируйте нужное в общий конфиг или в конфиг репозитория. Итог и источник каждого значения: debate config
# Указывайте только то, что хотите поменять: остальное берётся по умолчанию.

[roles]
proposer = "claude"   # автор плана
critic   = "grok"     # критик
executor = "claude"   # исполнитель
reviewer = "grok"     # ревьюер диффа

[debate]
max_rounds = 4        # раундов «критика → ответ» до эскалации вам
blind_first = true    # критик сначала делает свой разбор, не видя плана
turn_timeout_min = 30

[exec]
enabled = true
use_worktree = true   # false — исполнять прямо в репозитории (если нужны данные вне git)
max_review_rounds = 2

[rules]
language = "ru"       # язык планов, замечаний и вопросов агентов (ru, en, de… или название); инструкции им — на английском
# Правила, общие для всех задач ЭТОГО репозитория (добавляются обоим агентам).
# Специфику конкретной задачи пишите в самом тикете, а не здесь.
extra = ""

# --- другие агенты: назначьте их в [roles], модель — в model ---
# [agents.qwen]
# model = "qwen3-coder-plus"
#
# [agents.deepseek]            # своё имя для второго агента того же вида
# kind = "opencode"
# model = "deepseek/deepseek-chat"

# --- права агентов ---
# Стандартные права уже заданы. Чтобы ДОБАВИТЬ право, используйте allow_exec / allow_debate:
# эти списки дописываются из всех конфигов, а не заменяют стандартный список.
#
# [agents.claude]
# model = ""                     # например "claude-opus-5-5"; пусто — модель CLI по умолчанию
# allow_exec = ["Bash(dotnet build:*)", "Bash(dotnet test:*)"]
#
# exec_args / debate_args ЗАМЕНЯЮТ стандартные аргументы целиком — трогайте, только если точно нужно.
