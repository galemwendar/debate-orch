[project]
name = "debate-orch"
version = "0.1.0"
description = "Console orchestrator: two coding-agent CLIs (Claude Code, Grok Build, Qwen Code, OpenCode) debate a plan, you approve, one executes, the other reviews"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["rich>=13"]
keywords = ["ai", "agents", "claude-code", "grok", "opencode", "qwen-code", "orchestrator", "code-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
debate = "debate.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
